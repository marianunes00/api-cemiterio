<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sepulturas</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="container py-5">

    <a href="../index.html" class="btn btn-outline-success mb-4">
        <i class="fa-solid fa-arrow-left"></i>
        Voltar
    </a>

    <h1 class="titulo-pagina">
        <i class="fa-solid fa-monument"></i>
        Sepulturas
    </h1>

   <div class="card-page">

    <div class="row mb-4 align-items-end">

    <div class="col-md-3">

        <label class="form-label">
            Pesquisar por
        </label>

        <select
            id="tipoFiltro"
            class="form-select">

            <option value="id">
                ID
            </option>

            <option value="lote">
                Lote
            </option>

            <option value="tipo">
                Tipo
            </option>

            <option value="status">
                Status
            </option>

        </select>

    </div>


    <div class="col-md-5">

        <label class="form-label">
            Valor da pesquisa
        </label>

        <input
            id="txtPesquisa"
            type="text"
            class="form-control"
            placeholder="Digite o valor">

    </div>


    <div class="col-md-2 d-grid">

        <button
            id="btnPesquisar"
            class="btn btn-success btn-pesquisar">

            <i class="fa-solid fa-magnifying-glass"></i>
            Pesquisar

        </button>

    </div>


    <div class="col-md-2 d-grid">

        <button
            id="btnNovo"
            class="btn btn-success btn-novo">

            <i class="fa-solid fa-plus"></i>
            Nova

        </button>

    </div>

</div>

    <!-- tabela -->

</div>

        <hr>

        <table class="table table-hover align-middle">

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Lote</th>
                    <th>Tipo</th>
                    <th>Status</th>
                    <th>Familiar Responsável</th>
                    <th>Data Criação</th>
                    <th>Ações</th>

                </tr>

            </thead>

            <tbody id="tbodySepulturas">

                <tr>

                    <td colspan="7" class="text-center">

                        Nenhum registro encontrado.

                    </td>

                </tr>

            </tbody>

        </table>

         <!-- Modal responsável pelo cadastro de uma nova sepultura -->
            <div class="modal fade" id="modalSepultura" tabindex="-1">

                <div class="modal-dialog">

                    <div class="modal-content">

                        <div class="modal-header">

                            <h5 class="modal-title" id="tituloModal">
                                Nova Sepultura
                            </h5>

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal">
                            </button>

                        </div>

                        <div class="modal-body">

                            <div class="mb-3">

                                <label>Lote</label>

                                <input
                                    id="lote"
                                    class="form-control">

                            </div>

                            <div class="mb-3">

                                <label>Tipo</label>

                                <input
                                    id="tipoSepultura"
                                    class="form-control">

                            </div>

                            <div class="mb-3">

                                <label for="statusSepultura">
                                    Status
                                </label>

                                <select
                                    id="statusSepultura"
                                    class="form-select">

                                    <option value="">
                                        Selecione o status
                                    </option>

                                    <option value="DISPONIVEL">
                                        Disponível
                                    </option>

                                    <option value="OCUPADA">
                                        Ocupada
                                    </option>

                                </select>

                        </div>

                            <div class="mb-3">

                                <label>Familiar Responsável</label>

                                <input
                                    id="familiarResponsavel"
                                    class="form-control">

                            </div>

                            <div class="mb-3">

                                <label>Data de Criação</label>

                                <input
                                    type="date"
                                    id="dataCriacao"
                                    class="form-control">

                            </div>

                        </div>

                        <div class="modal-footer">

                            <button
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">

                                Cancelar

                            </button>

                            <button
                                id="btnSalvar"
                                class="btn btn-success">

                                Salvar

                            </button>

                        </div>

                    </div>

                </div>

            </div>


       <div class="d-flex justify-content-center mt-3">

    <button
        id="btnAnterior"
        class="btn btn-outline-success me-2">

        <i class="fa-solid fa-angle-left"></i>

    </button>


    <span
        id="infoPagina"
        class="align-self-center">

        Página 1

    </span>


    <button
        id="btnProxima"
        class="btn btn-outline-success ms-2">

        <i class="fa-solid fa-angle-right"></i>

    </button>

    </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/sepultura.js"></script>

</body>
</html>
